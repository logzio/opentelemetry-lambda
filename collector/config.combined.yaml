receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "localhost:4317"
      http:
        endpoint: "localhost:4318"
  telemetryapireceiver:
    types: ["platform", "function", "extension"]

processors:
  batch:
  # Jaeger (classic) rejects non-scalar tags (arrays/maps). Drop array attributes
  # (process.command_args, aws.log.group.names, process.tags) to prevent "invalid tag type" 500s.
  # If you need these values, stringify arrays with a transform processor instead of dropping.
  attributes/drop_array_tags:
    actions:
      - key: process.command_args
        action: delete
      - key: aws.log.group.names
        action: delete
      - key: process.tags
        action: delete
  resource/drop_array_tags:
    attributes:
      - key: process.command_args
        action: delete
      - key: aws.log.group.names
        action: delete
      - key: process.tags
        action: delete
  # Console output during an invocation arrives over OTLP from the Logz.io hooks, with trace and span IDs.
  # Drop the Telemetry API copy of those lines so they are not sent twice, and Lambda's per-invocation
  # START and END lines. Platform records and output written outside an invocation (init, crashes) are kept.
  filter/invocation-output:
    error_mode: ignore
    logs:
      log_record:
        # Runtime line format: "<timestamp>\t<request id>\t<LEVEL>\t<message>"; init lines carry "undefined".
        - 'attributes["type"] == "function" and IsMatch(body, "^\\S+\\t[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\\t")'
        - 'attributes["type"] == "platform.start" or attributes["type"] == "platform.runtimeDone"'

exporters:
  logzio/logs:
    account_token: "${env:LOGZIO_LOGS_TOKEN}"
    region: "${env:LOGZIO_REGION}"
    headers:
      user-agent: logzio-opentelemetry-layer-logs
  logzio/traces:
    account_token: "${env:LOGZIO_TRACES_TOKEN}"
    region: "${env:LOGZIO_REGION}"
    headers:
      user-agent: logzio-opentelemetry-layer-traces
  prometheusremotewrite:
    endpoint: "https://listener.logz.io:8053"
    headers:
      Authorization: "Bearer ${env:LOGZIO_METRICS_TOKEN}"
      user-agent: logzio-opentelemetry-layer-metrics
    target_info:
      enabled: false

service:
  pipelines:
    traces:
      receivers: [otlp, telemetryapireceiver]
      processors: [resource/drop_array_tags, attributes/drop_array_tags, batch]
      exporters: [logzio/traces]
    metrics:
      receivers: [otlp, telemetryapireceiver]
      processors: [batch]
      exporters: [prometheusremotewrite]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [logzio/logs]
    logs/telemetryapi:
      receivers: [telemetryapireceiver]
      processors: [filter/invocation-output, batch]
      exporters: [logzio/logs]
  telemetry:
    logs:
      level: "info"
