# Logz.io gateway mode: set OPENTELEMETRY_COLLECTOR_CONFIG_URI=/opt/collector-config/config.gateway.yaml
# Sends traces and function logs to the Logz.io gateway collector, which adds APM metrics and forwards to Logz.io.
# Cold starts: Lambda's Telemetry API reports init time; it is sent as a `platform.init` span.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "localhost:4317"
      http:
        endpoint: "localhost:4318"
  telemetryapi:
    types: ["platform", "function"]

processors:
  batch:
  # Keep only the init (cold start) span from the platform events; invocation spans come from the SDK.
  filter/platform:
    error_mode: ignore
    traces:
      span:
        - 'IsMatch(name, "^platform\\.") and not IsMatch(name, "^platform\\.init")'

exporters:
  otlphttp:
    endpoint: "${env:LOGZIO_GATEWAY_ENDPOINT}"
    headers:
      Authorization: "Bearer ${env:LOGZIO_GATEWAY_TOKEN}"

service:
  pipelines:
    traces:
      receivers: [otlp, telemetryapi]
      processors: [filter/platform, batch]
      exporters: [otlphttp]
    logs:
      receivers: [telemetryapi]
      processors: [batch]
      exporters: [otlphttp]
